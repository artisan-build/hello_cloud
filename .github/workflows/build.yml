# Builds one language branch's linux/arm64 binary and publishes it as a release
# asset that the branch's Laravel Cloud build command downloads.
#
# Everything language-specific comes out of the branch's own lang.json, so
# adding a language never touches this file. The runner is a free GitHub arm64
# runner (the repo is public) and the toolchain is whatever container image
# lang.json names, which is why ~30 languages need no new CI code.
name: build

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  binary:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Read lang.json
        id: lang
        run: |
          set -euo pipefail
          test -f lang.json || { echo "::error::this branch has no lang.json"; exit 1; }
          for k in language slug framework image build; do
            v=$(jq -er ".$k" lang.json)
            printf '%s=%s\n' "$k" "$v" >> "$GITHUB_ENV"
          done
          jq . lang.json

      - name: Sanity-check the branch against lang.json
        run: |
          set -euo pipefail
          test "$slug" = "${GITHUB_REF_NAME}" || {
            echo "::error::lang.json slug '$slug' != branch '${GITHUB_REF_NAME}'"; exit 1; }
          test -f go.mod || { echo "::error::no go.mod at the branch root; Cloud will not detect the Go runtime"; exit 1; }

      # The OG card is generated by main's single generator, before the language
      # build, so the language binary can embed og.png and ship nothing on disk.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generate og.png
        run: go run ./tools/ogen -language "$language" -out og.png

      - name: Build the binary in the language's own toolchain image
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 \
            -v "$PWD":/src -w /src \
            -e LANGUAGE="$language" -e SLUG="$slug" \
            "$image" sh -c "set -eux; $build"
          sudo chown "$(id -u):$(id -g)" app
          chmod +x app

      - name: Inspect the binary
        run: |
          set -euo pipefail
          file app
          ls -l app
          file app | grep -q 'ELF 64-bit LSB .*ARM aarch64' || {
            echo "::error::app is not a linux/arm64 ELF"; exit 1; }
          # Cloud's runtime is Debian 12 (glibc 2.36). Anything newer will not load.
          if command -v objdump >/dev/null && objdump -T app 2>/dev/null | grep -o 'GLIBC_2\.[0-9]*' | sort -uV | tail -1 | grep -qv '^$'; then
            echo "highest glibc symbol: $(objdump -T app | grep -o 'GLIBC_2\.[0-9]*' | sort -uV | tail -1)"
          fi

      # The real gate: run the binary on the same OS image Cloud runs, and ask
      # it for the page. A binary that links something bookworm lacks dies here
      # instead of in a Cloud deploy log.
      - name: Smoke-test on debian:12 (Cloud's runtime image)
        run: |
          set -euo pipefail
          docker run -d --name smoke --platform linux/arm64 -p 3000:3000 \
            -e PORT=3000 -v "$PWD/app":/app:ro debian:12 /app
          for i in $(seq 1 30); do
            if curl -fsS -o body.html -D headers.txt "http://127.0.0.1:3000/"; then ok=1; break; fi
            sleep 1
          done
          docker logs smoke || true
          test "${ok:-}" = 1 || { echo "::error::binary never answered on \$PORT"; exit 1; }
          grep -q "Hello from $language" body.html || { echo "::error::page is missing 'Hello from $language'"; exit 1; }
          grep -q "tree/$slug" body.html || { echo "::error::page is missing the branch link"; exit 1; }
          curl -fsS -D og.txt -o og-served.png "http://127.0.0.1:3000/og.png"
          grep -qi 'content-type: image/png' og.txt || { echo "::error::/og.png is not image/png"; exit 1; }
          cmp og.png og-served.png && echo "served og.png is byte-identical to the generated card"
          docker rm -f smoke

      - name: Publish the binary as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum app > app.sha256
          printf '%s\n' "$GITHUB_SHA" > VERSION
          tag="bin-$slug"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --target "$slug" \
              --title "$language binary (linux/arm64)" \
              --notes "Rolling release. The newest asset is built from the head of the \`$slug\` branch; VERSION holds the commit it came from."
          gh release upload "$tag" app app.sha256 VERSION --clobber
          echo "published https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag/app from $GITHUB_SHA"
